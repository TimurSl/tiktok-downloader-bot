[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-downloader-bot"
version = "2.0.0"
description = "Telegram media downloader bot (TikTok, YouTube, Instagram and more)"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "yt-dlp>=2023.12.30",
]

[project.scripts]
tiktok-downloader-bot = "tiktok_downloader_bot.bot:main"

[tool.setuptools.packages.find]
include = ["tiktok_downloader_bot*"]
